; ============================================================================
; PlatformIO project for the two-board smart elevator.
;
; Two environments, one project. Each builds a different board from a
; different source directory, and both share logic/.
;
;   pio run -e boardA              build Board A
;   pio run -e boardA -t upload    build and flash Board A
;   pio run -e boardB -t upload    Board B
;   pio device monitor -e boardA   serial monitor
;
; WHY PLATFORMIO AND NOT THE ARDUINO IDE
; The Arduino IDE compiles only files inside the sketch folder, so
; logic/pid.c was never compiled and control.cpp failed at link with
; "undefined reference to pid_init" -- pointing at a function that plainly
; existed. build_src_filter below fixes that properly: logic/ is compiled
; as part of the target build, from the same source the host tests run
; against, with no duplicated copy to drift.
;
; logic/test/ is excluded from both environments. Those cases are for the
; host harness and pull in stdio.
; ============================================================================

[platformio]
src_dir = .
default_envs = boardA

[env]
; The official platform, which ships arduino-esp32 2.0.x.
;
; The hardware timer and ESP-NOW APIs changed incompatibly in 3.x, and the
; prototypes were written against 3.x because that is what the Arduino IDE
; installed. Rather than depend on a community platform fork -- whose
; postinstall script fails on Windows -- every affected call site carries an
; ESP_ARDUINO_VERSION_MAJOR guard, so this source builds unchanged on either
; core. That keeps the two build machines on this project independent of
; which core each happens to have.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The N16R8 module: 16 MB flash, 8 MB OCTAL PSRAM. Getting the PSRAM mode
; wrong on this part gives a board that boots erratically or not at all,
; with no useful error.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1        ; without this, Serial output never appears
    -Wall
    -Wextra

[env:boardA]
build_src_filter =
    +<ElevatorA/>
    +<logic/>
    -<logic/test/>
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    miguelbalboa/MFRC522 @ ^1.4.11
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

[env:boardB]
build_src_filter =
    +<ElevatorB/>
lib_deps =
